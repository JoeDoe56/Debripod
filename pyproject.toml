[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debripod"
version = "0.1.0"
description = "Local async media app for DebriPod"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.14",
  "aioslsk>=0.7",
  "yt-dlp==2026.8.19",
  "keyring>=25.7.0",
  "webauthn>=2.8",
  "pywebpush>=2.3"
]

[project.scripts]
debripod = "debripod.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["debripod*"]
