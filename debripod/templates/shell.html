<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DebriPod</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico?v={{ icon_v }}">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v={{ icon_v }}">
  <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon-precomposed.png?v={{ icon_v }}">
  <link rel="manifest" href="/site.webmanifest?v={{ icon_v }}">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DebriPod">
  {% if autorefresh %}
  <meta http-equiv="refresh" content="{{ autorefresh }}">
  {% endif %}
    <link rel="stylesheet" href="{{ url_for('static', filename='debripod.css') }}?v={{ asset_v }}">

</head>
<body>
  <div class="passkeyGate" id="passkeyGate" hidden>
    <div class="passkeyGatePanel">
      <div class="passkeyGateKicker">Account security</div>
      <h1>Create a passkey?</h1>
      <p>Use this device or your system credential manager to sign in faster next time. Your DebriPod password will still work.</p>
      <div class="passkeyGateError" id="passkeyGateError" role="status"></div>
      <div class="passkeyGateActions">
        <button type="button" id="passkeyGateAdd">Create Passkey</button>
        <button type="button" class="secondary" id="passkeyGateSkip">Not Now</button>
      </div>
    </div>
  </div>
  <div class="wrap" id="divwrap">
    <canvas class="visualizerBg off" id="visualizerBg" aria-hidden="true"></canvas>
    <div style="margin-top:0;">
      <div id="tab-library">
        <div class="ipodStage">
          <div class="topPills">
            <div class="pathPill" id="libHeader">
              <div class="pathPillGlass liquidGlass" aria-hidden="true"></div>
              <span class="pathPillText hScrollText glassText" id="libHeaderText" data-text="Library" data-liquid-ignore>Library</span>
            </div>
          </div>

          <div class="ipodScreen" id="ipodScreen">
            <div class="ipodScreenContent">
              <div id="libListSelectedGlass" class="libListSelectedGlass liquidGlass" aria-hidden="true"></div>
              <ul class="ipodList liquidGlass" id="libList" data-liquid-list-surface></ul>

              <div class="nowPlaying" id="nowPlaying">
                <canvas class="npArt" id="npArt" data-liquid-ignore></canvas>
                <img id="npArtLiquidSource" class="npArtLiquidSource" alt="" crossorigin="anonymous" data-liquid-ignore>

                <div class="npOverlayPill" id="npOverlayPill">
                  <div class="npOverlayGlass liquidGlass" aria-hidden="true"></div>
                  <div class="npOverlaySurface" id="npOverlaySurface" data-liquid-ignore>
                    <div class="npTitle" id="npTitle"></div>
                    <div class="npSub" id="npSub"></div>

                    <div class="npBarArea">
                      <div class="npProgressWrap" id="npProgressWrap">
                        <input class="npSeek" id="npSeek" type="range" min="0" max="1000" value="0">
                        <div class="npSeekIndicator" id="npSeekIndicator"></div>
                      </div>

                      <div class="npVolumeWrap" id="npVolumeWrap">
                        <div class="npVolumeBar"><div class="npVolumeFill" id="npVolumeFill"></div></div>
                      </div>
                    </div>

                    <div class="npTime">
                      <div id="npCur">0:00</div>
                      <div class="npTechInline" id="npTech"></div>
                      <div id="npDur">0:00</div>
                    </div>
                  </div>
                </div>


                <div class="npVideoOverlay" id="npVideoOverlay" style="display:none;">
                  <video id="npVideo" controls autoplay playsinline></video>
                </div>

                <audio id="audioMain" preload="auto" playsinline></audio>
              </div>
            </div>
          </div>

          <div class="wheelZone" id="wheelZone">
            <div class="ipodWheelWrap">
              <div class="wheel" id="wheel">
                <div class="wheelGlassRing liquidGlass" id="wheelGlassRing" aria-hidden="true"></div>
                <div class="wheelLabel wlTop" data-liquid-ignore><span class="menuWord glassText" data-text="MENU">MENU</span></div>
                <div class="wheelLabel wlLeft" data-liquid-ignore><span class="glassGlyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 6 12l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 6 12l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 7 6 12l5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M18 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
                <div class="wheelLabel wlRight" data-liquid-ignore><span class="glassGlyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m6 7 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m6 7 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m13 7 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="m6 7 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
                <div class="wheelLabel wlBottom" data-liquid-ignore><span class="glassGlyph"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5c2 0 3.3 0 4.4.8 1.1.7 2 2 3 3.4 1-1.4 1.9-2.7 3-3.4 1.1-.8 2.4-.8 4.4-.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 7h3v3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17h3v-3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5c2 0 3.3 0 4.4.8 1.1.7 2 2 3 3.4 1-1.4 1.9-2.7 3-3.4 1.1-.8 2.4-.8 4.4-.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 7h3v3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17h3v-3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5c2 0 3.3 0 4.4.8 1.1.7 2 2 3 3.4 1-1.4 1.9-2.7 3-3.4 1.1-.8 2.4-.8 4.4-.8" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 7h3v3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 17h3v-3" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>

                <div class="wheelHit hitTop wheelBtn" id="btnMenu" title="Menu"></div>
                <div class="wheelHit hitLeft wheelBtn" id="btnRev" title="Previous track"></div>
                <div class="wheelHit hitRight wheelBtn" id="btnFwd" title="Next track"></div>
                <div class="wheelHit hitBottom wheelBtn" id="btnPlay" title="Play or pause"></div>

                <div class="wheelCenter" id="btnCenter" title="Select">
                  <div class="wheelCenterGlass liquidGlass" id="wheelCenterGlass" aria-hidden="true"></div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
  </div>

  

<script src="{{ url_for('static', filename='vendor/hls-local.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='liquidGL.js') }}?v={{ asset_v }}"></script>
<script>
  window.DEBRIPOD_APP_INFO = {{ info_json|safe }};
  window.DEBRIPOD_ASSET_VERSION = {{ asset_v|tojson }};
  window.DEBRIPOD_ICON_VERSION = {{ icon_v|tojson }};
  window.DEBRIPOD_TASKS_POLL_MS = {{ tasks_poll_ms }};
  window.DEBRIPOD_CSRF_TOKEN = {{ csrf_token|tojson }};
</script>
<script src="{{ url_for('static', filename='js/platform.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/api-client.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/passkeys.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/ui-settings.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/frame-scheduler.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/app-state.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/album-art-texture.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/liquid-glue.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/format-utils.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/path-pill.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/playback-loader.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/visualizer-engine.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/now-playing-ui.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/media-session.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/playback-sync.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/list-view.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/settings-ui.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/search-tasks-ui.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/library-browser.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/wheel-controls.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='js/client-sync.js') }}?v={{ asset_v }}"></script>
<script src="{{ url_for('static', filename='debripod.js') }}?v={{ asset_v }}"></script>
</body>
</html>
