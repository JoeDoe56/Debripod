<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>sfgl signed material regression</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; overflow: hidden; background: #111; color: white; font: 14px/1.25 system-ui, sans-serif; }
    #sourceCanvas { position: fixed; inset: 0; width: 100%; height: 100%; }
    main { position: relative; z-index: 10; display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 34px 24px; padding: 54px 44px; }
    .sample { display: grid; justify-items: center; gap: 9px; }
    .glass { width: min(190px, 20vw); height: 64px; border-radius: 32px; }
    .circle { width: 92px; height: 92px; border-radius: 50%; }
    .label { padding: 2px 8px; border-radius: 10px; background: rgb(0 0 0 / .72); text-shadow: 0 1px 2px #000; }
  </style>
</head>
<body>
  <canvas id="sourceCanvas" width="1280" height="800"></canvas>
  <main>
    <div class="sample"><div class="glass" id="material-n1"></div><div class="label">-1.00 dark</div></div>
    <div class="sample"><div class="glass" id="material-n52"></div><div class="label">-0.52 dark tinted</div></div>
    <div class="sample"><div class="glass" id="material-n12"></div><div class="label">-0.12 dark clear</div></div>
    <div class="sample"><div class="glass" id="material-0"></div><div class="label">0.00 transparent</div></div>
    <div class="sample"><div class="glass" id="material-p12"></div><div class="label">+0.12 light clear</div></div>
    <div class="sample"><div class="glass" id="material-p52"></div><div class="label">+0.52 light tinted</div></div>
    <div class="sample"><div class="glass" id="material-p1"></div><div class="label">+1.00 light</div></div>
    <div class="sample"><div class="glass circle" id="material-tilt"></div><div class="label">+0.52 circle + tilt</div></div>
  </main>
  <script src="/debripod/static/vendor/sfgl/sfgl.iife.js"></script>
  <script>
    const source = document.getElementById("sourceCanvas");
    const ctx = source.getContext("2d");
    const rainbow = ctx.createLinearGradient(0, 0, source.width, 0);
    [[0,"#f22"],[.17,"#fc0"],[.34,"#3d5"],[.5,"#1de"],[.67,"#36f"],[.84,"#c4f"],[1,"#f28"]].forEach(([at,color]) => rainbow.addColorStop(at,color));
    ctx.fillStyle = rainbow;
    ctx.fillRect(0, 0, source.width, source.height);
    for(let y = 0; y < source.height; y += 24){
      for(let x = 0; x < source.width; x += 24){
        ctx.fillStyle = ((x / 24 + y / 24) % 2) ? "rgba(0,0,0,.34)" : "rgba(255,255,255,.34)";
        ctx.fillRect(x, y, 12, 12);
      }
    }
    // One sfgl surface draws every sample. The no-LOD path is forced by the
    // WebGL1 context (no EXT_shader_texture_lod) and by the explicit caps.
    const glass = SFGL.createGlass({webgl2: false, quality: "superfluid", lighting: false, capsOverride: {lodMode: "bias"}});
    glass.setBackdrop(SFGL.imageBackdrop(source, {fit: "stretch"}));
    // z above the backdrop canvas (which follows this one in the DOM).
    const surface = glass.surface({z: 1});
    // Tilt about the lens centre, as the wheel's CSS tilt does.
    const tiltTransform = lens => {
      const r = lens.rect, cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      return {matrix: new DOMMatrix().translate(cx, cy).multiply(new DOMMatrix("perspective(900px)")).rotateAxisAngle(1, 0, 0, 12).rotateAxisAngle(0, 1, 0, -8).translate(-cx, -cy), tiltX: 12, tiltY: -8};
    };
    const samples = [
      ["material-n1", -1], ["material-n52", -.52], ["material-n12", -.12], ["material-0", 0],
      ["material-p12", .12], ["material-p52", .52], ["material-p1", 1], ["material-tilt", .52]
    ];
    const lenses = samples.map(([id, material]) => surface.lens(document.getElementById(id), {
      material,
      reveal: "none",
      ...(id === "material-tilt" ? {transform: tiltTransform} : {})
    }));
    window.__glassFixture = {glass, surface, lenses};
  </script>
</body>
</html>
